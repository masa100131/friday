<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/home/logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/home/logo.png" />
    <link rel="apple-touch-icon" href="/home/icon.webp" />
    <link rel="icon" href="/home/logo.png" />
    <title>B'z</title>
    <link rel="stylesheet" href="/home/p-style.css?v=2" />
  </head>
  <body>
    <main class="container">
      <img src="logo.png" alt="B'z" class="page-logo" />
      <p>
        現在リニューアル作業を行っております。<br />
        ご不便をおかけいたしますが、 公開まで今しばらくお待ちください。
      </p>
      <div class="loader"></div>
      <div
        onclick="loadVideo(this, 'AMQI7HSZGXI?si=SDScUzPCth6O4C78')"
        style="
          position: relative;
          width: 100%;
          padding-top: 56.25%;
          margin: 20px 0;
          cursor: pointer;
          background: url(&quot;https://img.youtube.com/vi/AMQI7HSZGXI/maxresdefault.jpg&quot;)
            center/cover no-repeat;
          border-radius: 8px;
          overflow: hidden;
        "
      ></div>
      <script>
        function loadVideo(container, videoId) {
          container.innerHTML = `<iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" src="https://www.youtube.com/embed/${videoId}&autoplay=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
          container.onclick = null;
        }
      </script>
      <a href="https://marumaru0131.cloudfree.jp" class="back-link">BACK</a>
    </main>
  </body>
</html>
